# App
spring.application.name=david-api
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tramed_dw}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Ingestion API key (used by the sparkbind pharmacy clients, not by dashboard users)
app.api-key=${INGEST_API_KEY:TRAMEDNYARUGENGE-2026}

# Dashboard login (single shared account) — override ADMIN_USERNAME/ADMIN_PASSWORD
# via environment variables in production. These defaults are for local dev only.
app.admin-username=${ADMIN_USERNAME:admin}
app.admin-password=${ADMIN_PASSWORD:changeme123}

# JWT signing secret for dashboard login tokens. MUST be set via env var in
# production (JWT_SECRET) — if left blank, a random key is generated at
# startup, which is fine for local dev but means every restart invalidates
# existing sessions and multiple app instances won't accept each other's tokens.
app.jwt-secret=${JWT_SECRET:}
app.jwt-expiration-ms=${JWT_EXPIRATION_MS:28800000}
